name: Weekly Data Update & Deploy

# 每周自动抓取 OpenAlex/Crossref/arXiv 真实数据 → 生成数据集 → 提交 → 构建 → 部署 GitHub Pages
on:
  schedule:
    # 每周一 02:17 UTC（避开整点高峰）
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write   # 把生成的数据集提交回仓库
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GITHUB_PAGES: "true"
      # OpenAlex polite pool 邮箱（用 secret 可填真实邮箱以提升限额）；缺省用仓库邮箱
      OA_MAILTO: ${{ secrets.OA_MAILTO || 'apextrace@users.noreply.github.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run data pipeline (fetch + synthesize + metrics)
        run: npm run pipeline

      - name: Commit generated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A src/lib/data/generated/ || true
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "chore(data): 每周自动更新真实数据集 [skip ci]"
            git push
          fi
